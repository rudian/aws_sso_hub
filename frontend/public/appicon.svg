<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AWS SSO Hub app icon. macOS grid: 824x824 rounded square at (100,100), radius 185.
       Motif: a fan of three account "passes" (identity colours) with a keyhole on the front pass. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D3747"/>
      <stop offset="1" stop-color="#121721"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4E8EF"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#05070B" flood-opacity=".45"/>
    </filter>
    <clipPath id="frontclip"><rect x="242" y="404" width="540" height="356" rx="60"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
    <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
  </g>

  <!-- back pass: cobalt -->
  <g transform="rotate(-15 512 600)" filter="url(#cardshadow)">
    <rect x="242" y="300" width="540" height="356" rx="60" fill="#4A6CF0"/>
  </g>
  <!-- middle pass: jade -->
  <g transform="rotate(-6 512 600)" filter="url(#cardshadow)">
    <rect x="242" y="352" width="540" height="356" rx="60" fill="#1AB488"/>
  </g>
  <!-- front pass: porcelain with iris identity stripe and keyhole -->
  <g filter="url(#cardshadow)">
    <rect x="242" y="404" width="540" height="356" rx="60" fill="url(#front)"/>
  </g>
  <g clip-path="url(#frontclip)">
    <rect x="242" y="404" width="92" height="356" fill="#8B6CF2"/>
  </g>
  <g fill="#1C2330">
    <circle cx="574" cy="548" r="56"/>
    <path d="M548 580 L600 580 L622 678 Q624 690 612 690 L536 690 Q524 690 526 678 Z"/>
  </g>
</svg>
